name: Update Render Secrets

on:
  workflow_dispatch:
    inputs:
      admin_password:
        description: 'Site admin şifresi (ADMIN_PASSWORD)'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update Render environment variables
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error

          API_KEY        = os.environ["RENDER_API_KEY"]
          ADMIN_PASSWORD = os.environ["ADMIN_PASSWORD"]
          NEW_CRON_SECRET = "48cff9f6269586c4aa949b86f017502a7ea97bdc39ae848f96addf3adfe1f8ab"
          NEW_IP_SALT     = "4e4168e4cb312c87c8eecc4b7cb4fe21c7e14bfaf5878e1a49fb55d2d99ebc97"

          # Web service ID is known from previous run
          WEB_ID_KNOWN = "srv-d7j3uocvikkc73eu1oa0"

          BASE    = "https://api.render.com/v1"
          HEADERS = {"Authorization": f"Bearer {API_KEY}", "Content-Type": "application/json"}

          def api(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req  = urllib.request.Request(BASE + path, data=data, headers=HEADERS, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print(f"HTTP {e.code} on {method} {path}: {e.read().decode()}")
                  raise

          # -- Find service IDs -- try both /services and /services?type=cron ------
          def find_services():
              web_id = WEB_ID_KNOWN
              cron_id = None
              # Search all services (some accounts separate cron from web)
              for endpoint in ["/services?limit=100", "/services?limit=100&type=cron"]:
                  try:
                      items = api("GET", endpoint)
                      for item in items:
                          svc = item.get("service", item)
                          name = svc.get("name", "")
                          sid  = svc.get("id", "")
                          print(f"  Found: {name} ({sid})")
                          if name == "zirve-daily-reset":
                              cron_id = sid
                  except Exception as e:
                      print(f"  Warning: {endpoint} failed: {e}")
              return web_id, cron_id

          print("Searching for services...")
          web_id, cron_id = find_services()
          print(f"\nWeb  service ID : {web_id}")
          print(f"Cron service ID : {cron_id or 'NOT FOUND (will skip)'}")

          # -- Merge overrides into current env vars --------------------------------
          def update_env_vars(svc_id, overrides, label):
              current = api("GET", f"/services/{svc_id}/env-vars")
              env = {}
              for item in current:
                  ev = item.get("envVar", item)
                  if "key" in ev:
                      env[ev["key"]] = ev.get("value", "")
              env.update(overrides)
              body = [{"key": k, "value": v} for k, v in env.items()]
              api("PUT", f"/services/{svc_id}/env-vars", body)
              print(f"  [OK] {label}: updated {list(overrides.keys())}")

          print("\nUpdating web service...")
          update_env_vars(web_id, {
              "CRON_SECRET":    NEW_CRON_SECRET,
              "IP_SALT":        NEW_IP_SALT,
              "ADMIN_PASSWORD": ADMIN_PASSWORD,
          }, "zirve-app-node")

          if cron_id:
              print("Updating cron service...")
              update_env_vars(cron_id, {
                  "CRON_SECRET": NEW_CRON_SECRET,
              }, "zirve-daily-reset")
          else:
              print("\n[WARNING] Cron service not found via API.")
              print("  Manually set CRON_SECRET in Render dashboard for zirve-daily-reset:")
              print(f"  {NEW_CRON_SECRET}")

          print("\nDone!")
          PYEOF
